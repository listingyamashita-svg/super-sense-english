<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111827" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="超感覚英語" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="styles.css" />
<title>超感覚英語 - ナオト版</title>
</head>
<body>
<div id="app">
<header class="topbar"><div><small>SUPER-SENSE ENGLISH</small><h1>超感覚英語 <span>ナオト版</span></h1></div><button id="installBtn" class="ghost" hidden>ホーム画面に追加</button></header>
<main>
<section id="home" class="view active">
  <div class="hero card"><div><p class="eyebrow">今日のスキマ学習</p><h2 id="greeting">3分だけ、英語を前から出す。</h2><p>読むより、思い出す。日本語訳ではなく場面から英語へ。</p></div><button class="primary big" data-mode="quick">3分トレーニング</button></div>
  <div class="stats grid3"><div class="card stat"><b id="streak">0</b><span>連続日数</span></div><div class="card stat"><b id="mastery">0%</b><span>習得率</span></div><div class="card stat"><b id="todayCount">0</b><span>今日の回答</span></div></div>
  <h3>学習メニュー</h3>
  <div class="menu-grid">
   <button class="menu card" data-nav="lessons"><b>コアイメージ</b><span>17語を理解</span></button>
   <button class="menu card" data-mode="flash"><b>フラッシュカード</b><span>苦手ほど再出題</span></button>
   <button class="menu card" data-mode="quiz"><b>4択クイズ</b><span>10問サクッと</span></button>
   <button class="menu card" data-nav="phrases"><b>セブ生活50</b><span>場面別フレーズ</span></button>
   <button class="menu card" data-nav="business"><b>仕事英語</b><span>会議・広告運用</span></button>
   <button class="menu card" data-nav="progress"><b>学習記録</b><span>進捗・苦手</span></button>
  </div>
</section>
<section id="lessons" class="view"><div class="section-head"><button class="back">←</button><div><p class="eyebrow">CORE IMAGE</p><h2>コアイメージ</h2></div></div><div id="lessonList" class="stack"></div></section>
<section id="lessonDetail" class="view"><div class="section-head"><button class="back" data-back="lessons">←</button><div><p class="eyebrow" id="ldNo"></p><h2 id="ldTitle"></h2></div></div><div id="lessonBody"></div></section>
<section id="phrases" class="view"><div class="section-head"><button class="back">←</button><div><p class="eyebrow">CEBU LIFE</p><h2>セブ生活50フレーズ</h2></div></div><div class="filter-row"><button class="chip active" data-cat="全部">全部</button></div><div id="phraseList" class="stack"></div></section>
<section id="business" class="view"><div class="section-head"><button class="back">←</button><div><p class="eyebrow">WORK</p><h2>仕事・マーケ英語</h2></div></div><div id="bizList" class="stack"></div></section>
<section id="progress" class="view"><div class="section-head"><button class="back">←</button><div><p class="eyebrow">PROGRESS</p><h2>学習記録</h2></div></div><div id="progressBody"></div></section>
<section id="trainer" class="view"><div class="section-head"><button class="back">×</button><div><p class="eyebrow" id="trainLabel">TRAINING</p><h2 id="trainTitle">3分トレーニング</h2></div></div><div class="trainer card"><div class="progressbar"><i id="bar"></i></div><p id="qMeta" class="muted"></p><h2 id="question"></h2><div id="answerArea"></div><div id="feedback"></div><div class="trainer-actions"><button id="reveal" class="secondary">答えを見る</button><button id="next" class="primary" hidden>次へ</button></div></div></section>
</main>
<nav class="bottom-nav"><button data-nav="home" class="active">ホーム</button><button data-nav="lessons">イメージ</button><button data-nav="phrases">50フレーズ</button><button data-mode="quick">3分</button></nav>
</div>
<script src="data.js"></script><script src="app.js"></script>
</body></html>
